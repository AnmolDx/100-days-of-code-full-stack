<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Checkbox</title>
</head>
<body>
   <form action="/server">
      <input type="checkbox" id="verification" checked name="age">
      <label for="verification">I am 18+</label>
      <button>submit</button>
   </form>
</body>
</html>
