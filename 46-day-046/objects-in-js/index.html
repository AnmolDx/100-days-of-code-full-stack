<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Object-oriented JavaScript example</title>
</head>

<body>
    <p>
        This example requires you to enter commands in your browser's JavaScript
        console (see
        <a
            href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Tools_and_setup/What_are_browser_developer_tools">What
            are browser developer tools</a>
        for more information).
    </p>

    <script>
        const person = {
            name: {
                first: "Bob",
                last: "Smith"
            },
            age: 32,
            bio: function () {
                console.log(`${this.name[0]} ${this.name[1]} is ${this.age} years old.`);
            },
            introduceSelf: function () {
                console.log(`Hi! I'm ${this.name[0]}.`);
            },
        };
        function logProperty(propertyName) {
            console.log(person[propertyName])
        }
        logProperty("name")

        person.age = 45;
        person["name"]["last"] = "Krish"

        person["eyes"] = "blue"
        person["farewell"] = function () {
            console.log("Goodbye Everybody!!")
        }

        const myDataName = "height"
        const myDataValue = "5ft 10in"

        person[myDataName] = myDataValue

        function increaseCounterObject(objectCounter) {
            objectCounter.counter += 1;
        }

        function increaseCounterPrimitive(primitiveCounter) {
            primitiveCounter += 1;
        }

        const object = { counter: 0 };
        let primitive = 0;

        increaseCounterObject(object);
        increaseCounterPrimitive(primitive);

        
    </script>
</body>

</html>
